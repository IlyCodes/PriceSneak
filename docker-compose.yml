version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pricesneak_postgres
    environment:
      POSTGRES_USER: pricesneak_user
      POSTGRES_PASSWORD: pricesneak_password
      POSTGRES_DB: pricesneak_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: pricesneak_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: pricesneak_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
